[package]
name = "logos-solver"
version = "0.1.0"
edition = "2024"
description = "Logos SQL equivalence solver frontend."
license = "MIT"

[[bin]]
name = "logos-solver"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "3.1"
logos-ir = { path = "../logos-ir" }
postgres = "0.19"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
