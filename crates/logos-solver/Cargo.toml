[package]
name = "logos-solver"
version = "0.1.0"
edition = "2024"
description = "Logos SQL equivalence solver frontend."
license = "MIT"

[[bin]]
name = "logos-solver"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "3.1"
libc = "0.2"
logos-ir = { path = "../logos-ir" }
postgres = { version = "0.19", features = ["with-chrono-0_4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
